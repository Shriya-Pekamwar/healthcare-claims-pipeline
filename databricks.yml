bundle:
  name: healthcare-claims-pipeline

targets:
  prod:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    ingest_bronze:
      name: healthcare-ingest-bronze
      description: Loads CMS DE-SynPUF CSVs from the raw volume into bronze Delta tables.
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./ingestion/notebooks/01_ingest_bronze.py
            base_parameters:
              config_path: ../../config/sources.yml