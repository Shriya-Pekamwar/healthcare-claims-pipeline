[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ingestion/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline_core"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: imports after sys.path edits, and spark/dbutils/display are injected globals
"ingestion/notebooks/*" = ["E402", "F821"]

[tool.pytest.ini_options]
pythonpath = ["ingestion/src"]
testpaths = ["tests"]