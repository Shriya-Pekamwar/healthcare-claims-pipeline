version: 2

models:
  - name: stg_synpuf__beneficiaries
    description: One row per beneficiary per coverage year. Typed and renamed from the three yearly files.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [beneficiary_id, coverage_year]
    columns:
      - name: beneficiary_id
        description: Synthetic beneficiary identifier (DESYNPUF_ID).
        data_tests: [not_null]
      - name: coverage_year
        data_tests:
          - not_null
          - accepted_values:
              values: [2008, 2009, 2010]
              quote: false
      - name: birth_date
        data_tests: [not_null]
      - name: sex
        data_tests:
          - accepted_values:
              values: ['Male', 'Female', 'Unknown']

  - name: stg_synpuf__inpatient_claims
    description: One row per inpatient claim segment.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [claim_id, claim_segment]
    columns:
      - name: claim_id
        data_tests: [not_null]
      - name: beneficiary_id
        data_tests: [not_null]
      - name: claim_from_date
        description: Parsed from CLM_FROM_DT (yyyyMMdd). Null means the raw value could not be parsed.
        data_tests: [not_null]

  - name: stg_synpuf__outpatient_claims
    description: One row per outpatient claim segment.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [claim_id, claim_segment]
    columns:
      - name: claim_id
        data_tests: [not_null]
      - name: beneficiary_id
        data_tests: [not_null]
      - name: claim_from_date
        data_tests: [not_null]
